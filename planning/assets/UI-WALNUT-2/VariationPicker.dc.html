<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Variation picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#8A4B22}a:hover{color:#5E3215}
</style>
</helmet>
<div style="width: 390px; height: 560px; box-sizing: border-box; background: #F4F1EC; color: #2A211B; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 16px">
  <div style="position: relative; width: 358px; height: 358px; box-sizing: border-box; padding: 14px; background: #4A3222; border-radius: 10px; box-shadow: 0 10px 24px rgba(42,33,27,0.25)">
    <div style="position: relative; width: 330px; height: 330px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); border-radius: 2px; overflow: hidden">
      <sc-for list="{{squares}}" as="sq" hint-placeholder-count="64">
        <div style="position: relative; background: {{sq.bg}}">
          <sc-if value="{{sq.tinted}}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; inset: 0; background: rgba(240,196,64,0.55)"></div>
          </sc-if>
          <sc-if value="{{sq.has}}" hint-placeholder-val="{{ false }}">
            <img src="{{sq.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%">
          </sc-if>
        </div>
      </sc-for>
      <svg viewBox="0 0 8 8" width="330" height="330" aria-hidden="true" style="position: absolute; inset: 0">
        <path d="M1.5 0.5L2.321 2.142" stroke="rgba(74,50,34,0.85)" stroke-width="0.16" stroke-linecap="round"></path>
        <path d="M2.5 2.5L2.124 2.240L2.518 2.044Z" fill="rgba(74,50,34,0.85)"></path>
        <path d="M3.5 1.5V2.1" stroke="rgba(138,75,34,0.55)" stroke-width="0.16" stroke-linecap="round"></path>
        <path d="M3.5 2.5L3.28 2.1H3.72Z" fill="rgba(138,75,34,0.55)"></path>
      </svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 13px; color: #6E6056; padding: 0 2px">Two moves continue from here. Tap an arrow or a line.</span>
    <div role="radiogroup" aria-label="Continue with" style="display: flex; gap: 8px">
      <button aria-pressed="true" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 12px; border: 2px solid #4A3222; background: #FFFFFF; color: #2A211B; text-align: left">
        <span style="font-size: 11px; font-weight: 600; color: #6E6056; letter-spacing: 0.3px">MAIN LINE</span>
        <span style="font-size: 16px; font-weight: 700">2…Nc6</span>
      </button>
      <button style="flex: 1 1 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 12px; border: 1px solid #E4DCD1; background: #FFFFFF; color: #2A211B; text-align: left">
        <span style="font-size: 11px; font-weight: 600; color: #6E6056; letter-spacing: 0.3px">VARIATION</span>
        <span style="font-size: 16px; font-weight: 600">2…d6</span>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const PIECES = {K:'/_blob/ccb885a37c2ef0fc6634b9b8da792411',Q:'/_blob/d5aac2d1c7dea93288fb3eb835fcafe9',R:'/_blob/5a5003a3c09f056b62ca99020ad9d16e',B:'/_blob/9b72916cab7b4674f4f8ce2ac5380ee9',N:'/_blob/117899e9e882a6171fb6ef905e08f710',P:'/_blob/40c7a18597b66234d0357d0f148c11c2',k:'/_blob/b9ff6ec344378fb226567af83cbe30ad',q:'/_blob/015d6c9ce5ce3e8b51d77b4c9c9c7010',r:'/_blob/2c06870ffd470a04373fa4c1e1e29160',b:'/_blob/9aa6dd1591bbdaa8b9e1787db1db01bd',n:'/_blob/3fb4e2a85a0d9a274bcec0c809c4db8d',p:'/_blob/fbd1185e69a8fd531fd6f55fc3248515'};
    const FEN = 'rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R';
    const files = 'abcdefgh', last = ['g1', 'f3'];
    const squares = [];
    FEN.split('/').forEach((row, ri) => {
      const rank = 8 - ri, cells = [];
      for (const ch of row) { if (/\d/.test(ch)) { for (let i = 0; i < +ch; i++) cells.push(null); } else cells.push(ch); }
      cells.forEach((ch, fi) => squares.push({ bg: (fi + rank) % 2 === 0 ? '#ECD9B6' : '#B07E52', tinted: last.includes(files[fi] + rank), has: !!ch, img: ch ? PIECES[ch] : '' }));
    });
    return { squares };
  }
}
</script>
</body>
</html>
