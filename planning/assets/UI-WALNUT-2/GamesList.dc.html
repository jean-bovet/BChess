<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Games list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#8A4B22}a:hover{color:#5E3215}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8C8580; font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #2A211B; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">
  <div style="height: 790px; box-sizing: border-box; background: #F4F1EC; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; padding: 8px 16px 28px; gap: 12px">
    <div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #CFC3B4"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button style="height: 44px; border: 0; background: transparent; color: #8A4B22; font-size: 17px; padding: 0">Import</button>
      <span style="font-family: 'New York', 'Iowan Old Style', 'Palatino', serif; font-size: 18px; font-weight: 600">Games</span>
      <button style="height: 44px; border: 0; background: transparent; color: #8A4B22; font-size: 17px; font-weight: 600; padding: 0">Done</button>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 600; color: #6E6056; letter-spacing: 0.3px; padding: 0 4px">{{g.title}}</span>
        <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E4DCD1; border-radius: 14px; overflow: hidden">
          <sc-for list="{{g.games}}" as="r" hint-placeholder-count="3">
            <button style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: {{r.divider}}; background: {{r.bg}}; text-align: left; color: #2A211B">
              <span style="width: 36px; height: 36px; border-radius: 9px; background: #F2DFB8; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                <img src="/_blob/3fb4e2a85a0d9a274bcec0c809c4db8d" alt="" style="width: 28px; height: 28px">
              </span>
              <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
                <span style="font-family: 'New York', 'Iowan Old Style', 'Palatino', serif; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
                <span style="font-size: 12px; color: #6E6056">{{r.date}}</span>
              </span>
              <sc-if value="{{r.current}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #4A3222; color: #F4E6CF">OPEN</span>
              </sc-if>
            </button>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <div style="flex-grow: 1"></div>
    <span style="font-size: 12px; color: #6E6056; text-align: center">Swipe left on a game to delete it.</span>
    <button style="height: 52px; border: 0; border-radius: 14px; background: #4A3222; color: #F4E6CF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      New Game
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (title, date, current, first) => ({ title, date, current, bg: current ? '#FFFBF3' : '#FFFFFF', divider: first ? '0' : '1px solid #EFE9E1' });
    const groups = [
      { title: 'TODAY', games: [row('You vs Computer', '10:42', true, true), row('Ruy Lopez practice', '08:15', false, false)] },
      { title: 'EARLIER', games: [row('You vs Computer 3', 'Oct 5, 2026', false, true), row('Anna vs Jean', 'Oct 2, 2026', false, false), row('Imported game', 'Sep 28, 2026', false, false)] }
    ];
    return { groups };
  }
}
</script>
</body>
</html>
