name: CI

# Builds and tests BChess on every PR and on pushes to main: the macOS app (with the C++ engine
# GoogleTests, which run as individual Swift Testing cases), the BChessUCI tool, the iOS app and its UI
# test, a Thread Sanitizer run of the concurrency tests, and the zero-warnings gate. No secrets are used.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS tests, UCI tool, warnings, Thread Sanitizer
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # The runner's default Xcode may be older: select the newest Xcode 26.x on the image.
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The committed project must match project.yml
      - name: Check the generated project is committed
        run: |
          xcodegen generate
          git diff --exit-code

      - name: Test the macOS scheme
        run: |
          set -o pipefail
          xcodebuild test -scheme "BChess (macOS)" -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-mac" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual \
            2>&1 | tee "$RUNNER_TEMP/mac.log"

      - name: Check the test log
        run: |
          log="$RUNNER_TEMP/mac.log"
          if grep -aE '✘|error:|\*\* TEST FAILED \*\*' "$log"; then
            echo "The macOS test log holds a failure"; exit 1
          fi
          # Every GoogleTest case must have run: a missing line or a smaller count is red
          line=$(grep -aoE 'Test gtest\(_:\) with [0-9]+ test cases passed' "$log" | head -1)
          echo "$line"
          count=$(echo "$line" | grep -oE '[0-9]+' | head -1)
          if [ -z "$count" ] || [ "$count" -lt 88 ]; then
            echo "Expected at least 88 GoogleTest cases, got '${count:-none}'"; exit 1
          fi

      - name: Build the UCI tool
        run: |
          set -o pipefail
          xcodebuild -scheme BChessUCI -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-uci" build \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual \
            2>&1 | tee "$RUNNER_TEMP/uci.log"

      # Fresh build directories, so that every file compiles and reports its warnings.
      # Vendored Dependencies/ and gtest-all.cc are exempt.
      - name: Warnings gate (iOS and macOS)
        run: |
          set -o pipefail
          filter() { grep -aE '^/.*(warning|error):|^(warning|error):' | grep -v -e ONLY_ACTIVE_ARCH -e /Dependencies/ -e gtest-all || true; }
          xcodebuild -target "BChess (iOS)" -sdk iphonesimulator -configuration Debug \
            SYMROOT="$RUNNER_TEMP/build-ios" OBJROOT="$RUNNER_TEMP/obj-ios" COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/warn-ios.log" 2>&1
          xcodebuild -target "BChess (macOS)" -configuration Debug \
            SYMROOT="$RUNNER_TEMP/build-mac" OBJROOT="$RUNNER_TEMP/obj-mac" COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual build > "$RUNNER_TEMP/warn-mac.log" 2>&1
          # The two app builds, the UCI build, and the macOS test log (which compiles the test target)
          warnings=$( (filter < "$RUNNER_TEMP/warn-ios.log"; filter < "$RUNNER_TEMP/warn-mac.log"; filter < "$RUNNER_TEMP/uci.log"; filter < "$RUNNER_TEMP/mac.log") )
          if [ -n "$warnings" ]; then
            echo "$warnings"; exit 1
          fi

      - name: Thread Sanitizer (concurrency tests)
        run: |
          set -o pipefail
          xcodebuild test -scheme "BChess (macOS)" -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-tsan" -enableThreadSanitizer YES \
            -only-testing:BChessTests/FEngineConcurrencyTests -only-testing:BChessTests/GameSessionTests \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual \
            2>&1 | tee "$RUNNER_TEMP/tsan.log"
          if grep -aE 'ThreadSanitizer: data race|WARNING: ThreadSanitizer|✘' "$RUNNER_TEMP/tsan.log"; then
            exit 1
          fi

  ios:
    name: iOS tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # iPhone 17 Pro when the image has it, else the first available iPhone
      - name: Pick a simulator
        run: |
          name='iPhone 17 Pro'
          if ! xcrun simctl list devices available | grep -q "    $name ("; then
            name=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]*' | head -1 | sed 's/ *$//')
          fi
          echo "Simulator: $name"
          echo "SIMULATOR_NAME=$name" >> "$GITHUB_ENV"

      - name: Test the iOS scheme
        run: |
          set -o pipefail
          xcodebuild test -scheme "BChess (iOS)" \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -derivedDataPath "$RUNNER_TEMP/dd-ios" CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/ios.log"
          if grep -aE '✘|error:|\*\* TEST FAILED \*\*' "$RUNNER_TEMP/ios.log"; then
            exit 1
          fi
          # Same zero-warnings rule for the iOS test log (the app and the UI test target)
          warnings=$(grep -aE '^/.*(warning|error):|^(warning|error):' "$RUNNER_TEMP/ios.log" | grep -v -e ONLY_ACTIVE_ARCH -e /Dependencies/ -e gtest-all || true)
          if [ -n "$warnings" ]; then
            echo "$warnings"; exit 1
          fi
